# Chart values for the Crossplane controller. Lines beginning with `# --` are consumed by helm-docs.

# -- Count of Crossplane controller pod replicas.
replicas: 1

# -- Maximum ReplicaSets to retain for the Crossplane Deployment (`revisionHistoryLimit`). Set `null` to omit the field and use the cluster default.
revisionHistoryLimit: null

# -- Deployment strategy for the Crossplane and RBAC Manager Deployments (`RollingUpdate` or `Recreate`).
deploymentStrategy: RollingUpdate

image:
  # -- Container image repository for the Crossplane controller (path only; tag is set separately). Default is the public image published by this project. For CI-built or private images, set this to your registry and repository (and set `image.tag` or a digest-based tag policy).
  repository: quay.io/konflux-ci/crossplane-components
  # -- Image tag for the Crossplane controller. Has no effect when `image.ignoreTag` is `true` (the default). When `ignoreTag` is `false` and this field is empty, the chart derives the tag as `v` plus `Chart.yaml` `appVersion`.
  tag: ""
  # -- Image pull policy for the Crossplane and RBAC Manager pods.
  pullPolicy: IfNotPresent
  # -- When true (default), the chart omits any tag suffix when constructing the image reference, relying on the repository value alone (digest-pinned or externally managed references). Set to `false` to let the chart append `image.tag` (or fall back to `v{appVersion}`).
  ignoreTag: true

# -- Node selector for the Crossplane controller pod (`spec.template.spec.nodeSelector`).
nodeSelector: {}
# -- Tolerations for the Crossplane controller pod.
tolerations: []
# -- Affinity rules for the Crossplane controller pod.
affinity: {}
# -- Topology spread constraints for the Crossplane controller pod.
topologySpreadConstraints: []

# -- Run the Crossplane pod with `hostNetwork: true`. Required only for exceptional networking setups; increases privilege and typically requires `dnsPolicy: ClusterFirstWithHostNet`.
hostNetwork: false

# -- DNS policy for the Crossplane pod (`ClusterFirst`, `ClusterFirstWithHostNet`, etc.). Leave empty to use the cluster default for the pod.
dnsPolicy: ""

# -- Additional labels merged into the Crossplane Deployment pod template.
customLabels: {}

# -- Additional annotations merged into the Crossplane Deployment pod template.
customAnnotations: {}

serviceAccount:
  # -- Create a dedicated ServiceAccount for the Crossplane controller.
  create: true
  # -- Name of an existing ServiceAccount to use when `serviceAccount.create` is false.
  name: ""
  # -- Annotations applied to the Crossplane ServiceAccount (for cloud IAM or registry integration).
  customAnnotations: {}

# -- Enable controller leader election when running multiple replicas. See Crossplane documentation on leader election.
leaderElection: true
# -- Extra container arguments appended to the Crossplane controller process.
args: []

provider:
  # -- OCI references for Provider packages to install at chart install time (for example `registry.example.com/org/provider-kubernetes:v1.0.0`). Untagged refs are pinned to `Chart.yaml` `appVersion`.
  packages:
    - quay.io/konflux-ci/crossplane-components/provider-kubernetes@sha256:8d6a88f1503d21e098816b44f0dc0e16867449c24a7441c5c5c374d9327b0715
  # -- Resource patterns for the default Managed Resource Activation Policy; `["*"]` allows all managed resources unless restricted elsewhere.
  defaultActivations: ["*"]

configuration:
  # -- OCI references for Configuration packages to install at chart install time.
  packages: []

function:
  # -- OCI references for Composition functions to install at chart install time. Untagged refs are pinned to `Chart.yaml` `appVersion`.
  packages:
    - quay.io/konflux-ci/crossplane-components/function-go-templating@sha256:eb7e0da7546b6d480e1b9c1b604450602cf3c0866d7ee9f16192c138b3c1a8ea
    - quay.io/konflux-ci/crossplane-components/function-auto-ready@sha256:368e1ecf89cae0b77bb2c25492fc233d26a7590e58c513517151eb11331a35dd
    - quay.io/konflux-ci/crossplane-components/function-patch-and-transform@sha256:5837d4622a41465d1666a8b6a616e6956f74a1794be2d351f669a0c492cdf5ca

# -- Names of `imagePullSecrets` referenced by the Crossplane ServiceAccount for private registries.
imagePullSecrets: []

registryCaBundleConfig:
  # -- ConfigMap name holding an additional CA bundle for TLS to OCI registries that use non-public CAs.
  name: ""
  # -- Key within that ConfigMap containing the PEM-encoded CA bundle.
  key: ""

service:
  # -- Annotations for the Crossplane admission webhook Service. Applied only when `webhooks.enabled` is true.
  customAnnotations: {}

secrets:
  # -- Default annotations applied to Secret resources managed or labeled by this chart where supported.
  customAnnotations: {}

webhooks:
  # -- Enable validating and mutating webhooks for Crossplane and compatible providers.
  enabled: true
  # -- Webhook listen port. Empty selects the chart default.
  port: ""

rbacManager:
  # -- Deploy the RBAC Manager and its RBAC objects.
  deploy: true
  # -- Omit installation of aggregated ClusterRoles for Crossplane (use when managing RBAC externally).
  skipAggregatedClusterRoles: false
  # -- Replica count for the RBAC Manager Deployment.
  replicas: 1
  # -- ReplicaSet history limit for the RBAC Manager Deployment; `null` omits the field.
  revisionHistoryLimit: null
  # -- Enable leader election for the RBAC Manager when running multiple replicas.
  leaderElection: true
  # -- Extra arguments for the RBAC Manager container.
  args: []
  # -- Node selector for the RBAC Manager pod.
  nodeSelector: {}
  # -- Tolerations for the RBAC Manager pod.
  tolerations: []
  # -- Affinity for the RBAC Manager pod.
  affinity: {}
  # -- Topology spread constraints for the RBAC Manager pod.
  topologySpreadConstraints: []

# -- PriorityClass name for Crossplane and RBAC Manager pods.
priorityClassName: ""

# -- RuntimeClass name for Crossplane and RBAC Manager pods (for example gVisor or Kata).
runtimeClassName: ""

resourcesCrossplane:
  limits:
    # -- CPU limit for the Crossplane controller container.
    cpu: 500m
    # -- Memory limit for the Crossplane controller container.
    memory: 1024Mi
  requests:
    # -- CPU request for the Crossplane controller container.
    cpu: 100m
    # -- Memory request for the Crossplane controller container.
    memory: 256Mi

securityContextCrossplane:
  # -- Numeric user ID for the Crossplane container process (`runAsUser`).
  runAsUser: 65532
  # -- Primary group ID for the Crossplane container process (`runAsGroup`).
  runAsGroup: 65532
  # -- Allow privilege escalation for the Crossplane container (should remain false in production).
  allowPrivilegeEscalation: false
  # -- Mount the container root filesystem read-only.
  readOnlyRootFilesystem: true

packageCache:
  # -- `emptyDir` medium for the package cache volume (`Memory` uses tmpfs; leave empty for node disk).
  medium: ""
  # -- Maximum size of the package cache volume; must not exceed node RAM when `medium` is `Memory`.
  sizeLimit: 20Mi
  # -- Use an existing PVC as the package cache instead of the default `emptyDir`.
  pvc: ""
  # -- Use an existing ConfigMap volume as the package cache instead of the default `emptyDir`.
  configMap: ""

functionCache:
  # -- `emptyDir` medium for the function runtime cache (`Memory` for tmpfs-backed cache).
  medium: ""
  # -- Maximum size of the function cache; constrained by node memory when `medium` is `Memory`.
  sizeLimit: 512Mi
  # -- Use an existing PVC as the function cache instead of the default `emptyDir`.
  pvc: ""

resourcesRBACManager:
  limits:
    # -- CPU limit for the RBAC Manager container.
    cpu: 100m
    # -- Memory limit for the RBAC Manager container.
    memory: 512Mi
  requests:
    # -- CPU request for the RBAC Manager container.
    cpu: 100m
    # -- Memory request for the RBAC Manager container.
    memory: 256Mi

securityContextRBACManager:
  # -- Numeric user ID for the RBAC Manager container.
  runAsUser: 65532
  # -- Primary group ID for the RBAC Manager container.
  runAsGroup: 65532
  # -- Allow privilege escalation for the RBAC Manager container (should remain false in production).
  allowPrivilegeEscalation: false
  # -- Mount the RBAC Manager root filesystem read-only.
  readOnlyRootFilesystem: true

metrics:
  # -- Expose Prometheus metrics and scrape annotations on Crossplane and RBAC Manager pods (port 8080 by default).
  enabled: false
  # -- Metrics server port; empty uses the chart default.
  port: ""

readiness:
  # -- Readiness probe HTTP port; empty uses the chart default.
  port: ""

# -- Extra environment variables for the Crossplane init container. Dots in names are replaced with underscores (for example `SAMPLE.KEY` becomes `SAMPLE_KEY`).
extraEnvVarsCrossplaneInit: {}

# -- Extra environment variables for the Crossplane main container. Dots in names are replaced with underscores.
extraEnvVarsCrossplane: {}

# -- Extra environment variables for the RBAC Manager container. Dots in names are replaced with underscores.
extraEnvVarsRBACManager: {}

# -- Pod-level `securityContext` merged into the Crossplane pod spec.
podSecurityContextCrossplane: {}

# -- Pod-level `securityContext` merged into the RBAC Manager pod spec.
podSecurityContextRBACManager: {}

# -- Additional volumes for the Crossplane pod; values may contain Helm template expressions.
extraVolumesCrossplane: {}

# -- Additional volume mounts for the Crossplane pod; values may contain Helm template expressions.
extraVolumeMountsCrossplane: {}

# -- Sidecar containers injected into the Crossplane pod; values may contain Helm template expressions.
sidecarsCrossplane: []

# -- Raw Kubernetes manifests (YAML) installed as part of this release (advanced; validate before production use).
extraObjects: []
